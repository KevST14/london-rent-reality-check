[project]
name = "london-rent-reality-check"
version = "0.1.0"
description = "Predict, explain, and forecast London rental prices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "geopandas>=1.0",
    "shapely>=2.0",
    "osmnx>=2.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "kaggle>=1.6",
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "playwright>=1.62.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/londonrent"]

[tool.ruff]
line-length = 100
# notebooks are generated from scripts and full of illustrative plotting code
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
# pyflakes (F) + pycodestyle (E) + import order (I) + a light bugbear pass (B).
# Notebooks are generated from scripts, so they're not linted.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]                # a couple of imports sit after a skip-guard constant
"app/streamlit_app.py" = ["E402"]  # imports follow a sys.path shim for Streamlit Cloud

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
